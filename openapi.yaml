openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Time Deposits
  description: API for managing bank time deposits and monthly interest calculations
paths:
  /api/v1/time-deposits/update-balances:
    post:
      tags:
      - Time Deposits
      summary: Update balances
      description: Performs monthly interest calculation and updates account balances
        for all time deposits
      operationId: updateBalances
      responses:
        "200":
          description: Balances successfully updated
          content:
            '*/*':
              schema:
                type: string
  /api/v1/time-deposits:
    get:
      tags:
      - Time Deposits
      summary: Get all time deposits
      description: Retrieves all time deposit plans with their associated historical
        withdrawals
      operationId: getAllTimeDeposits
      responses:
        "200":
          description: Successfully retrieved time deposits
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeDepositResponse"
components:
  schemas:
    TimeDepositResponse:
      type: object
      description: Time deposit plan details
      properties:
        id:
          type: integer
          format: int32
          description: Time deposit ID
          example: 1
        planType:
          type: string
          description: "Plan type (e.g. basic, student, premium)"
          example: basic
        balance:
          type: number
          format: double
          description: Current account balance
          example: 1000.0
        days:
          type: integer
          format: int32
          description: Number of active deposit days
          example: 45
        withdrawals:
          type: array
          description: List of historical withdrawals
          items:
            $ref: "#/components/schemas/WithdrawalResponse"
    WithdrawalResponse:
      type: object
      description: Withdrawal details
      properties:
        id:
          type: integer
          format: int32
          description: Withdrawal ID
          example: 1
        timeDepositId:
          type: integer
          format: int32
          description: Associated time deposit ID
          example: 2
        amount:
          type: number
          description: Withdrawn amount
          example: 500.0
        date:
          type: string
          format: date-time
          description: Date and time of withdrawal in ISO-8601 UTC format
          example: 2026-01-15T10:30:00Z
